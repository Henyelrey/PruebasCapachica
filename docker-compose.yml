version: '3.8'

services:
  # --- 1. BASE DE DATOS ---
  db:
    image: mysql:8.0
    container_name: turismo_db
    restart: always
    environment:
      MYSQL_DATABASE: turismobackend_test
      MYSQL_USER: nick
      MYSQL_PASSWORD: nick123
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

  # --- 2. BACKEND (LARAVEL) ---
  backend:
    build:
      context: ./turismo-backend
      dockerfile: Dockerfile
    container_name: turismo_backend
    restart: always
    ports:
      - "8080:80" # API accesible en http://localhost:8080
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: turismobackend_test
      DB_USERNAME: nick
      DB_PASSWORD: nick123
    depends_on:
      - db
    networks:
      - app-net

  # --- 3. FRONTEND (ANGULAR) ---
  frontend:
    build:
      context: ./turismo-frontend
      dockerfile: Dockerfile
    container_name: turismo_angular
    restart: always
    ports:
      - "80:80" # Web accesible en http://localhost
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  db_data: