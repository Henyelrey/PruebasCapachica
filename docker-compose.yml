version: '3.8'

services:
  # --- 1. BASE DE DATOS ---
  db:
    image: mysql:8.0
    container_name: turismo_db
    restart: always
    # ESTA LÍNEA ES NUEVA: Arregla el error de conexión de clientes antiguos
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: turismobackend_test
      MYSQL_USER: nick
      MYSQL_PASSWORD: nick123
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net
    ports:
      - "3307:3306"   # --- AGREGAR ESTO (Usamos 3307 para que no choque con tu MySQL local) ---
  # --- 2. BACKEND (LARAVEL) ---
  backend:
    build:
      context: ./turismo-backend
      dockerfile: Dockerfile
    container_name: turismo_backend
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_CONNECTION: mysql
      # CAMBIO: Usamos el nombre exacto del contenedor para asegurar DNS
      DB_HOST: turismo_db 
      DB_PORT: 3306
      DB_DATABASE: turismobackend_test
      DB_USERNAME: nick
      DB_PASSWORD: nick123
    depends_on:
      - db
    networks:
      - app-net

  # --- 3. FRONTEND (ANGULAR) ---
  frontend:
    build:
      context: ./turismo-frontend
      dockerfile: Dockerfile
    container_name: turismo_angular
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  db_data: